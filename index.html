<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshStock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><h1>FreshStock</h1><p>Control de Inventario</p></div>
            <div class="user-info">
                <span class="user-avatar" id="userAvatar"></span>
                <div class="user-details">
                    <span class="user-name" id="userName"></span>
                    <span class="user-role" id="userRole"></span>
                </div>
            </div>
            <ul class="nav-menu" id="navMenu"></ul>
            <div class="sidebar-user"><a href="#" class="logout-btn" onclick="logout()">Cerrar Sesión</a></div>
        </aside>
        <main class="main-content">
            <div id="pages"></div>
            <div id="toast" class="toast hidden"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">Registrar Producto</h2><button class="close-btn" onclick="closeModal()">&times;</button></div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-grid">
                    <div class="form-group"><label for="nombre">Nombre *</label><input type="text" id="nombre" required placeholder="Ej: Yogurt Natural 1L"></div>
                    <div class="form-group"><label for="categoria">Categoría *</label><select id="categoria" required><option value="">Seleccionar categoría...</option></select></div>
                    <div class="form-group"><label for="stock">Stock *</label><input type="number" id="stock" required min="0" placeholder="0"></div>
                    <div class="form-group"><label for="stock_min">Stock Mínimo *</label><input type="number" id="stock_min" required min="0" placeholder="5"></div>
                    <div class="form-group"><label for="precio_compra">Precio Compra ($) *</label><input type="number" id="precio_compra" required min="0" step="0.01" placeholder="0.00"></div>
                    <div class="form-group"><label for="precio_venta">Precio Venta ($) *</label><input type="number" id="precio_venta" required min="0" step="0.01" placeholder="0.00"></div>
                    <div class="form-group full-width"><label for="fecha_vencimiento">Fecha Vencimiento *</label><input type="date" id="fecha_vencimiento" required></div>
                </div>
                <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-green">Guardar</button></div>
            </form>
        </div>
    </div>
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header"><h2>Confirmar Eliminación</h2><button class="close-btn" onclick="closeDeleteModal()">&times;</button></div>
            <div class="modal-body"><p>¿Eliminar este producto?</p>
                <div class="form-actions"><button class="btn btn-secondary" onclick="closeDeleteModal()">Cancelar</button><button class="btn btn-red" id="confirmDeleteBtn">Eliminar</button></div>
            </div>
        </div>
    </div>
    <div id="categoryModal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header"><h2>Nueva Categoría</h2><button class="close-btn" onclick="closeCategoryModal()">&times;</button></div>
            <form id="categoryForm">
                <div class="form-group"><label for="catName">Nombre de la categoría *</label><input type="text" id="catName" required placeholder="Ej: Refrigerados" list="catSuggestions">
                    <datalist id="catSuggestions"><option value="Lácteos"><option value="Carnes"><option value="Bebidas"><option value="Panadería"><option value="Refrigerados"></datalist>
                </div>
                <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Cancelar</button><button type="submit" class="btn btn-green">Guardar</button></div>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
